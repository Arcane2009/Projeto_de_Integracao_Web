<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro do Cliente - MapPet</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

  <div class="page-card">
    
    <!-- Título superior -->
    <h1 class="page-title">Faça seu cadastro/login</h1>

    <!-- Formulário com 4 campos verticais -->
    <form class="form-cadastro" action="/logar_usuario" method="POST">
      
      <div class="input-group">
        <label for="cpf_cliente-login">CPF</label>
        <input type="text" id="cpf_cliente-login" name="cpf_cliente-login" placeholder="Apenas números" required>
      </div>

      <div class="input-group">
        <label for="senha-login">Senha da conta</label>
        <input type="text" id="senha-login" name="senha-login" placeholder="Ex: UGhjvuf82" required>
      </div>

      <!-- Botão para enviar o formulário -->
      <button href="/logar" type="submit" class="btn-salvar">Logar</button>
      
    </form>

  </div>

</body>
</html>
